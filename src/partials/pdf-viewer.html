{{!-- Mobilon PDF.js, asztali gépen natív PDF-megjelenítés. --}}
<link rel="stylesheet" href="/assets/pdf-viewer/viewer.css" />
<div class="grid-container">
    <section class="callout pdf-reader" data-pdf-url="{{pdfUrl}}" data-fit-width="{{#if fitWidth}}true{{else}}false{{/if}}" aria-label="PDF-olvasó">
        <p><a href="{{pdfUrl}}" target="_blank" rel="noopener">PDF megnyitása külön lapon / letöltése</a></p>
        <div class="pdf-controls" hidden>
            <button type="button" data-action="prev" disabled>Előző</button>
            <span class="pdf-page" aria-live="polite"></span>
            <button type="button" data-action="next" disabled>Következő</button>
            <button type="button" data-action="out" aria-label="Kicsinyítés" disabled>−</button>
            <button type="button" data-action="in" aria-label="Nagyítás" disabled>+</button>
        </div>
        <p class="pdf-status" role="status">PDF betöltése…</p>
        <div class="pdf-surface" tabindex="0" aria-label="PDF dokumentum"></div>
        <noscript>A dokumentum a fenti hivatkozással nyitható meg.</noscript>
    </section>
</div>
<script src="/assets/pdf-viewer/viewer.js" defer></script>
